name: CI

on:
  push:
  pull_request:

jobs:
  core-only:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install core deps
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements-research-synth.txt
          python -m pip install -e . --no-deps
      - name: Tests
        run: |
          python -m pytest -q

  full-stack:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install full extras
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements-research-synth.txt
          python -m pip install -e . --no-deps
          python -m pip install pymupdf==1.26.7 python-docx==1.1.2 pandas==2.2.2 openpyxl==3.1.5
      - name: Tests
        run: |
          python -m pytest -q
